# Smithery.ai MCP Server Registry
# https://smithery.ai/docs/config
# Submit: https://smithery.ai/new (connect this repo)

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      DOKIMO_URL:
        type: string
        title: "Dokimo instance URL"
        description: "Base URL of your Dokimo/123bail instance (e.g. https://your-instance.example.com:8092)"
      DOKIMO_API_KEY:
        type: string
        title: "Dokimo API key"
        description: "API key (mcp_…) created in the Dokimo app (Settings → API keys)"
    required:
      - DOKIMO_URL
      - DOKIMO_API_KEY
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        DOKIMO_URL: config.DOKIMO_URL,
        DOKIMO_API_KEY: config.DOKIMO_API_KEY,
      },
    })

name: mcp-123bail
displayName: 123bail / Dokimo — Rental Management
description: |
  MCP server for 123bail / Dokimo, a self-hosted rental management app (France).
  10 tools: list landlords, properties and tenants, find leases, record payments,
  summarize rent due/paid/balance over N months, create new leases (baux),
  and generate rent receipt PDFs (quittances de loyer).
